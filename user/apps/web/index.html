<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)" />
		<!-- Apply the saved or system theme before first paint, so nothing flashes. Mirrors libs/theme.ts. -->
		<script>
			(() => {
				try {
					const match = document.cookie.match(/(?:^|; )theme=([^;]*)/);
					const theme = match ? decodeURIComponent(match[1]) : "system";
					const dark =
						theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
				} catch {
					// Without cookies or matchMedia the page starts light, and the app corrects it once it loads.
				}
			})();
		</script>
		<!-- The CSP has no 'unsafe-eval', so zod can't compile its parsers. Turning that off before any module loads also
		     skips zod's `new Function` probe, which the browser reports as a CSP violation even though zod catches it. -->
		<script>
			globalThis.__zod_globalConfig = { jitless: true };
		</script>
		<meta name="application-name" content="AI Resume Agent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="AI Resume Agent" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta
			name="description"
			content="AI Resume Agent — Intelligent career and resume management platform. Build, optimize, and elevate your professional narrative with ATS compatibility."
		/>

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
		<link rel="apple-touch-icon" href="/icon/light.svg" type="image/svg+xml" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

		<title>AI Resume Agent — Intelligent Career &amp; Resume Platform</title>
	</head>
	<body>
		<!-- Empty here; the server prerenders the homepage into it (apps/server/src/static/web.ts). -->
		<div id="app"></div>
		<!-- Branded first paint; hidden once React populates #app (higher-specificity rule below). -->
		<div id="initial-loader">
			<img class="initial-loader__logo-light" src="/icon/light.svg" width="48" height="48" alt="AI Resume Agent" />
			<img class="initial-loader__logo-dark" src="/icon/dark.svg" width="48" height="48" alt="AI Resume Agent" />
			<div class="initial-loader__spinner"></div>
			<span class="initial-loader__sr-only">Loading AI Resume Agent</span>
		</div>
		<style>
			@keyframes app-spin {
				to {
					transform: rotate(360deg);
				}
			}
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 20px;
				background: #f8fafc;
			}
			html.dark #initial-loader {
				background: #0b0f17;
			}
			.initial-loader__logo-dark,
			html.dark .initial-loader__logo-light {
				display: none;
			}
			html.dark .initial-loader__logo-dark {
				display: block;
			}
			#app:not(:empty) ~ #initial-loader {
				display: none;
			}
			.initial-loader__spinner {
				width: 28px;
				height: 28px;
				border: 2.5px solid rgba(15, 23, 42, 0.12);
				border-top-color: #2563eb;
				border-radius: 9999px;
				animation: app-spin 0.7s linear infinite;
			}
			html.dark .initial-loader__spinner {
				border-color: rgba(248, 250, 252, 0.15);
				border-top-color: #60a5fa;
			}
			.initial-loader__sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
			}
		</style>
		<script type="module" data-cfasync="false" src="/src/main.tsx"></script>
	</body>
</html>
